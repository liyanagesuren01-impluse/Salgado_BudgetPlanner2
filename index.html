<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salgado Budget Planner</title><style>
:root {
  --brown: #5c3317; --dbrown: #4a2c17; --green: #0b5d3b; --shadeA: #fbf6ec; --shadeB: #edf5ee;
  --bg: #f3f4f1; --surface: #ffffff; --surface-2: #eceee9; --ink: #16201d; --muted: #5b6662;
  --line: #d6dad3; --accent: #0d6b5e; --accent-ink: #ffffff; --accent-soft: #d9ece7;
  --s1: #2a78d6; --s2: #eb6834;
  --good: #0a7a3a; --good-soft: #dcf1e3; --warn: #a86a00; --warn-soft: #fbedcf; --bad: #c0362f; --bad-soft: #f8dedb;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; font-weight: 600; }
h1 { font-size: 20px; } h2 { font-size: 17px; } h3 { font-size: 15px; }
p { margin: 0 0 6px; max-width: 75ch; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.note { color: var(--muted); font-size: 12.5px; }
.neg { color: var(--bad); }
.hidden { display: none !important; }

/* Header */
header.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
.bar h1 { margin-right: 6px; color: var(--brown); font-weight: 700; }
.menu-btn { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); cursor: pointer; font-weight: 600; }
.menu-btn:hover { border-color: var(--accent); }
.sync { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }
.sync .dot.busy { background: var(--warn); } .sync .dot.err { background: var(--bad); }
.lockbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
.lockbtn.open { background: var(--warn-soft); border-color: var(--warn); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.kpi { background: var(--surface); padding: 8px 16px; }
.kpi .lab { font-size: 11.5px; color: var(--green); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.kpi .v { font-size: 21px; font-weight: 800; color: #000; }
.kpi .v.neg { color: var(--bad); }
.kpi .sub { font-size: 12px; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; padding: 0 10px; overflow-x: auto; border-top: 1px solid var(--line); }
nav.tabs button { border: 0; background: none; padding: 10px 12px; cursor: pointer; color: var(--muted); font-weight: 700; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--green); border-bottom-color: var(--green); }
nav.tabs button .later { font-size: 10.5px; color: var(--muted); margin-left: 4px; }

/* Dropdown menu: green with white lettering; regions open a side menu */
.menu-btn { background: var(--green); color: #fff; border-color: var(--green); }
.dd, .dd-side { position: fixed; z-index: 40; top: 54px; left: 16px; width: 290px; max-height: calc(100vh - 70px); overflow: auto; background: var(--green); color: #fff; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 6px; }
.dd-side { left: 312px; width: 280px; background: #0e6e47; }
.dd h4 { margin: 10px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #cfe8dc; }
.dd button, .dd-side button, .dd summary { display: block; width: 100%; text-align: left; border: 0; background: none; color: #fff; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.dd button:hover, .dd-side button:hover, .dd summary:hover { background: rgba(255,255,255,.14); }
.dd button.cur, .dd-side button.cur { background: rgba(255,255,255,.24); font-weight: 600; }
.dd button.open { background: rgba(255,255,255,.18); }
.dd button .arr { float: right; opacity: .8; }
.dd details { border-top: 1px solid rgba(255,255,255,.2); margin-top: 8px; padding-top: 4px; }
.dd summary { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #cfe8dc; list-style: none; }
.dd summary::before { content: '▸ '; } .dd details[open] summary::before { content: '▾ '; }
.dd-side h4 { margin: 8px 8px 4px; font-size: 12px; color: #fff; }
.dd .l2 { padding-left: 22px; }
.dd-back { position: fixed; inset: 0; z-index: 39; }

/* Layout */
.shell { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 14px; padding: 14px; align-items: start; }
.shell.full { grid-template-columns: minmax(0, 1fr); }
aside.levers { position: sticky; top: 170px; max-height: calc(100vh - 185px); overflow: auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
#main .card h2, #main .card > header h2 { color: var(--green); }
.exportbar { display: flex; justify-content: flex-end; gap: 6px; margin: -4px 0 10px; }
.exportbar .btn { font-size: 12.5px; padding: 4px 10px; }
.card > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { padding: 2px 8px; font-size: 12.5px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--surface-2); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.callout { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
.callout.warn { background: var(--warn-soft); }
.callout.bad { background: var(--bad-soft); }

/* Tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
th.dt, td.dt { color: var(--dbrown); font-weight: 700; }
table.zebra tr > *:nth-child(even):not(:first-child) { background: var(--shadeA); }
table.zebra tr > *:nth-child(odd):not(:first-child) { background: var(--shadeB); }
table.zebra tr.total > * { background-image: linear-gradient(rgba(0,0,0,.03), rgba(0,0,0,.03)); }
tr.total td { font-weight: 600; border-top: 1.5px solid var(--ink); }
tr.sub td:first-child { padding-left: 24px; color: var(--muted); }
tr.sub td { font-size: 12.5px; color: var(--muted); }
tr.head td { font-weight: 600; background: var(--surface-2); }
td.l, th.l { text-align: left; }
td input.num, td input.txt, td select { width: 100%; min-width: 80px; }
input.num, input.txt, select, textarea { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--surface); }
input.num { text-align: right; }
input.ovr { background: var(--warn-soft); border-color: var(--warn); }
input:disabled, select:disabled { background: var(--surface-2); color: var(--muted); }
.cellpair { display: flex; gap: 4px; align-items: center; }
.cellpair input { min-width: 70px; }
.reset { border: 0; background: none; cursor: pointer; color: var(--warn); padding: 0 2px; }
.tick { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--muted); }

/* Levers */
.lv-h { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 0 4px; }
.lv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.lv .nm { font-size: 13px; }
.lv .nm small { display: block; color: var(--muted); font-size: 11.5px; }
.stepper { display: inline-flex; align-items: center; gap: 2px; }
.stepper button { width: 24px; height: 24px; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; cursor: pointer; padding: 0; }
.stepper input { width: 62px; }
.lv .val { font-weight: 600; text-align: right; }
.monthtabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
.monthtabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 12.5px; }
.monthtabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.monthtabs button .flag { display: block; font-size: 10px; opacity: .8; }

/* Forms */
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 14px; }
.fld { display: flex; flex-direction: column; gap: 2px; }
.fld > span { font-size: 12.5px; }
.fld .hint { font-size: 11.5px; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); }
.item .t { font-weight: 600; }
.item .meta { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }

/* Modal */
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 60; display: flex; align-items: center; justify-content: center; }
.modal { background: var(--surface); border-radius: 12px; padding: 18px 20px; width: min(420px, 92vw); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal h2 { margin-bottom: 8px; }
.modal input { width: 100%; padding: 8px; font-size: 16px; margin: 8px 0; }

/* Login */
.login { max-width: 380px; margin: 12vh auto; }
.login .card { padding: 24px; }
.login input { width: 100%; padding: 8px; margin: 4px 0 10px; }

/* Chart */
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 70; max-width: 90vw; font-size: 13px; }

/* Print */
#printhost { display: none; }
@media print {
  body > *:not(#printhost) { display: none !important; }
  #printhost { display: block !important; }
  #printhost .exportbar, #printhost button, #printhost .btns:empty { display: none !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff; font-size: 11px; }
  .pdoc { page-break-after: always; }
  .pdoc:last-child { page-break-after: auto; }
  .pdoc h1 { font-size: 16px; margin-bottom: 2px; }
  .pdoc .meta { color: #555; margin-bottom: 10px; }
  .pdoc h2 { font-size: 13px; margin: 12px 0 4px; }
  th, td { padding: 3px 6px; }
  @page { size: A4 landscape; margin: 12mm; }
  .pdoc .card { border: 0; padding: 0; margin-bottom: 10px; }
  .pdoc .grid2 { display: block; }
  .pdoc .chart svg { max-height: 240px; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  aside.levers { position: static; max-height: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
</style></head><body><div id="app"></div><script>
'use strict';
/* =====================================================================
   Salgado Budget Planner · core: settings, storage and the P&L engine
   ===================================================================== */

// ---------- Connection settings: filled in when the planner is hosted ----------
// Own server (e.g. Lanka Host, PHP + MySQL): set API_URL to 'api.php'. Leave everything empty for demo mode (this computer only).
const API_URL = '';            // own server: 'api.php'
// Or Supabase instead of your own server:
const SUPABASE_URL = '';       // e.g. https://abcdefgh.supabase.co
const SUPABASE_KEY = '';  // Supabase: Settings > API Keys > Publishable key (sb_publishable_…)
const LOGIN_DOMAIN = 'salgado-planner.app'; // login name "FMbudgetplanner" = fmbudgetplanner@salgado-planner.app in Supabase

// ---------- Small helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => { const n = typeof v === 'string' ? parseFloat(v.replace(/[,\s]/g, '')) : +v; return isFinite(n) ? n : 0; };
const isNum = v => v !== null && v !== undefined && v !== '' && isFinite(+v);
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const pad2 = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const thisYm = () => todayStr().slice(0, 7);
function ymAdd(ym, n) { let y = +ym.slice(0, 4), m = +ym.slice(5, 7) + n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad2(m)}`; }
const dim = ym => new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
const monthLabel = ym => { if (!ym) return '—'; const d = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1, 1); return d.toLocaleString('en-GB', { month: 'short' }) + ' ' + ym.slice(2, 4); };
function addDays(ds, n) { const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function weekStart(ds) { const d = new Date(ds + 'T00:00:00'); const wd = (d.getDay() + 6) % 7; return addDays(ds, -wd); } // Monday
const fmtDate = ds => { if (!ds) return '—'; const d = new Date(ds.slice(0, 10) + 'T00:00:00'); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: '2-digit' }); };
function overlapDays(ws, ym) { let n = 0; for (let i = 0; i < 7; i++) if (addDays(ws, i).slice(0, 7) === ym) n++; return n; }

const money = v => {
  if (v == null || !isFinite(v)) return '—';
  const a = Math.abs(v), sg = v < 0 ? '−' : '';
  if (a >= 1e6) return `${sg}Rs ${(a / 1e6).toFixed(2)}M`;
  if (a >= 1e3) return `${sg}Rs ${Math.round(a / 1e3).toLocaleString('en-US')}k`;
  return `${sg}Rs ${Math.round(a)}`;
};
const full = v => (v == null || !isFinite(v)) ? '—' : (v < 0 ? '−' : '') + Math.round(Math.abs(v)).toLocaleString('en-US');
const pct = (v, d = 1) => v == null || !isFinite(v) ? '—' : `${v < 0 ? '−' : ''}${Math.abs(v * 100).toFixed(d)}%`;
const spct = (v, d = 1) => v == null || !isFinite(v) ? '—' : `${v >= 0 ? '+' : '−'}${Math.abs(v * 100).toFixed(d)}%`;
const spts = (v, d = 1) => v == null || !isFinite(v) ? '—' : `${v >= 0 ? '+' : '−'}${Math.abs(v * 100).toFixed(d)} pts`;

async function sha256(text) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 0; for (const c of text) h = (h * 31 + c.charCodeAt(0)) | 0; return 'x' + h; }
}
const PIN_SALT = 'salgado-planner:';

function toast(msg) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toast.tm); toast.tm = setTimeout(() => { t.hidden = true; }, 3500);
}

// =====================================================================
// Storage: one key-value table. Local (this browser) or Supabase (shared).
// =====================================================================
const Store = {
  mode: 'local', data: {}, rev: 0, session: null, lastSync: null, pending: 0, error: '', onChange: null,
  kind: API_URL ? 'php' : 'supabase',
  remoteConfigured() { return !!API_URL || !!(SUPABASE_URL && SUPABASE_KEY); },
  // ---- own server (api.php) ----
  async php(action, body, qs = '') {
    const r = await fetch(`${API_URL}?action=${action}${qs}`, { method: body ? 'POST' : 'GET', credentials: 'same-origin', cache: 'no-store', headers: { 'Content-Type': 'application/json', 'X-SGP': '1' }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { if (action !== 'login') this.saveSession(null); throw new Error(j.error || '401 Signed out'); }
    if (!r.ok) throw new Error(j.error || `${r.status} server error`);
    return j;
  },
  get(k) { return this.data[k] ?? null; },
  keys(prefix) { return Object.keys(this.data).filter(k => k.startsWith(prefix)); },
  bump() { this.rev++; Engine.clear(); },
  async set(k, v) { this.data[k] = v; this.bump(); return this.persist(k, v); },
  async del(k) { delete this.data[k]; this.bump(); return this.persist(k, null); },
  async persist(k, v) {
    if (this.mode === 'local') { try { localStorage.setItem('sgp-db', JSON.stringify(this.data)); } catch (e) { toast('Could not save on this computer (storage full or blocked).'); return false; } return true; }
    return this.push([{ key: k, value: v }]);
  },
  loadLocal() { try { this.data = JSON.parse(localStorage.getItem('sgp-db') || '{}') || {}; } catch (e) { this.data = {}; } this.bump(); },
  // ---- Supabase ----
  hdr(extra = {}) { return { apikey: SUPABASE_KEY, ...(this.session ? { Authorization: 'Bearer ' + this.session.access_token } : {}), 'Content-Type': 'application/json', ...extra }; },
  saveSession(s) { this.session = s; try { if (s) localStorage.setItem('sgp-session', JSON.stringify(s)); else localStorage.removeItem('sgp-session'); } catch (e) { /* ignore */ } },
  restoreSession() { try { const s = JSON.parse(localStorage.getItem('sgp-session') || 'null'); if (s && (s.refresh_token || (s.php && this.kind === 'php'))) this.session = s; } catch (e) { /* ignore */ } return !!this.session; },
  async auth(body, grant) {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, { method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Sign-in failed');
    this.saveSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, user: (j.user && j.user.email) || body.email || '' });
  },
  login(user, pass) { if (this.kind === 'php') return this.php('login', { user: user.trim(), pass }).then(j => this.saveSession({ user: j.user, php: true })); const email = user.includes('@') ? user.trim() : `${user.trim().toLowerCase()}@${LOGIN_DOMAIN}`; return this.auth({ email, password: pass }, 'password'); },
  async ensureFresh() { if (this.kind === 'php') return; if (this.session && Date.now() > this.session.expires_at - 60000) await this.auth({ refresh_token: this.session.refresh_token }, 'refresh_token'); },
  async api(path, opts = {}, retry = true) {
    await this.ensureFresh();
    const r = await fetch(SUPABASE_URL + path, { ...opts, headers: this.hdr(opts.headers) });
    if (r.status === 401 && retry && this.session) { await this.auth({ refresh_token: this.session.refresh_token }, 'refresh_token'); return this.api(path, opts, false); }
    if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error(`${r.status} ${t.slice(0, 160)}`); }
    return r;
  },
  async loadRemote() {
    if (this.kind === 'php') { const j = await this.php('load'); const all = {}; j.rows.forEach(x => { if (x.value !== null) all[x.key] = x.value; }); this.data = all; this.lastSync = j.seq; this.bump(); return; }
    const all = {}; let from = 0, latest = null;
    for (;;) {
      const r = await this.api('/rest/v1/kv?select=key,value,updated_at&order=key', { headers: { Range: `${from}-${from + 999}`, 'Range-Unit': 'items' } });
      const rows = await r.json();
      rows.forEach(x => { if (x.value !== null) all[x.key] = x.value; if (!latest || x.updated_at > latest) latest = x.updated_at; });
      if (rows.length < 1000) break; from += 1000;
    }
    this.data = all; this.lastSync = latest || new Date(0).toISOString(); this.bump();
  },
  async push(rows) {
    this.pending++; this.error = ''; this.onChange && this.onChange('sync');
    const now = new Date().toISOString();
    try {
      if (this.kind === 'php') { await this.php('put', { rows }); return true; }

// Engine: base, plan, actuals, benchmark and budget P&Ls (memoised per data revision)

const Engine = {

const BASE_LINES = ['wastage', 'gaspack', 'branchExp', 'ss', 'oh', 'bm', 'chef', 'bo', 'comp', 'ho', 'rmSal'];

function baseOf(u) {

function basePct(u) {

function askPin(reason) {

    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Director PIN"><h2>Director PIN</h2><p class="note">${esc(reason || 'Enter the PIN to unlock.')}</p>

  if (n === 2) { const pm = ms.map(m => ymAdd(m, -ms.length)), P = scopeLM(sc, pm, 'actual'), pl = pm.length === 1 ? monthLabel(pm[0]) : `${monthLabel(pm[0])} – ${monthLabel(pm[pm.length - 1])}`; return plTable([{ label: pl, L: P }, { label: lab, L: A }], { rest, cats: true, variance: [0, 1] }); }
  if (n === 3) { const K = scopeLM(sc, ms, 'bench'); return plTable([{ label: 'Benchmark', L: K }, { label: 'Actual', L: A }], { rest, cats: true, variance: [0, 1] }); }

  const ra = ratioRows(A, { rest }), rx = Object.fromEntries(ratioRows(X, { rest }).map(r => [r.k, r]));

    ${ra.map(r => { const x = rx[r.k] ? rx[r.k].v : null; if (r.v == null && x == null) return ''; const d = r.v != null && x != null ? r.v - x : null;

      if (!rid || !m) return;
      const id = newId(), ym = PYM(), mt = MODEL_TYPES[m.type] || MODEL_TYPES.small_branch;
      const cats = Object.keys(m.sales || {}).filter(k => num(m.sales[k]) > 0 && CFG().cats.some(c => c.id === k));
      await saveCfg(c => { c.units.push({ id, name, regionId: rid, type: mt.unitType, cats, opens: ym, planned: true, modelId: m.id }); });
      const S = sum(cats.map(k => num(m.sales[k]))), b = { sales: {}, rm: {}, prod: {} };
      cats.forEach(k => { b.sales[k] = num(m.sales[k]); b.rm[k] = Math.round(num(m.sales[k]) * num((m.rm || {})[k] ?? defaultRmPct({ type: mt.unitType }, k)) / 100); });
      ['wastage', 'gaspack', 'branchExp', 'ss', 'oh', 'bm'].forEach(k => { b[k] = Math.round(S * num(m[k]) / 100); });
      await Store.set('base:' + id, b);
      await upsertAutoTask('task:open:' + id, `Open ${name} (${m.name}) in ${monthLabel(ym)}`, { id, name }, ym);
      toast(`${name} added, opening ${monthLabel(ym)}.`); return go();
    }
    case 'opening-remove': {
      const u = unitById(d.uid); if (!confirm(`Remove the planned outlet ${u.name}?`)) return;
      await saveCfg(c => { c.units = c.units.filter(x => x.id !== u.id); });
      for (const k of [...Store.keys('base:' + u.id), ...Store.keys('plan:' + u.id), ...Store.keys(`task:open:${u.id}`), ...Store.keys(`task:staff:${u.id}:`), ...Store.keys(`task:capex:${u.id}:`), ...Store.keys(`dec:chg:${u.id}:`)]) await Store.del(k);
      return go();
    }
    // Tasks and decisions
    case 'task-open': ui.openTask = ui.openTask === d.key ? null : d.key; return go();
    case 'task-done': await updRec(d.key, r => { r.status = 'done'; r.doneAt = todayStr(); }); ui.openTask = null; toast('Task marked done.'); return go();
    case 'task-reopen': await updRec(d.key, r => { r.status = 'pending'; delete r.doneAt; }); return go();
    case 'task-del': if (!confirm('Delete this task?')) return; await Store.del(d.key); return go();
    case 'task-add': {
      const title = ($('#nt-title').value || '').trim(); if (!title) return toast('Write the task first.');
      const uid = $('#nt-unit').value, u = unitById(uid);
      await Store.set('task:' + newId(), { title, unit: uid, where: u ? u.name : 'Group', owner: $('#nt-owner').value, due: $('#nt-due').value, notes: $('#nt-notes').value, status: 'pending', source: 'manual', createdAt: new Date().toISOString() });
      ui.decTab = 'pending'; toast('Task created.'); return go();
    }
    case 'dec-task': return decToTask(d.key);
    case 'dec-dismiss': await updRec(d.key, r => { r.status = 'dismissed'; }); return go();
    case 'dec-add': {
      const text = ($('#nd-text').value || '').trim(); if (!text) return; const uid = $('#nd-unit').value, u = unitById(uid);
      await Store.set('dec:' + newId(), { kind: 'manual', text, unit: uid, where: u ? u.name : 'Group', status: 'open', createdAt: new Date().toISOString() }); return go();
    }
    // Budgets
    case 'approve': {
      const b = currentBudget();
      if (b && !await needUnlock('Replacing the approved budget needs the director PIN.')) return;
      const ms = perMonths('bud'), fy = ms.length === 1 ? monthLabel(ms[0]) : `${monthLabel(ms[0])} – ${monthLabel(ms[ms.length - 1])}`;
      const name = prompt(b ? 'Name for the new budget' : 'Name for the budget', `Budget ${fy}${b ? ' (revised)' : ''}`); if (name == null) return;
      const id = newId(); await Store.set('budget:' + id, snapshotBudget(name.trim() || `Budget ${fy}`, ms)); await saveCfg(c => { c.budgetId = id; }); ui.per.bud = null;
      toast('Budget approved and locked.'); return go();
    }
    case 'print-budget': return printBudget();
    case 'print-var': return printVariance();
    // Actuals
    case 'act-submit': {
      if (!confirm('Submit and lock this month? Only a director can unlock it.')) return;
      await updRec(d.key, r => { r.v = r.v || {}; r.submitted = true; r.submittedAt = todayStr(); }, { v: {} }); toast('Month submitted and locked.'); return go();
    }
    case 'act-unlock': if (!await needUnlock('Unlocking a submitted month needs the director PIN.')) return; await updRec(d.key, r => { r.submitted = false; }); toast('Month unlocked.'); return go();
    // Set-up
    case 'region-add': { const name = ($('#nr-name').value || '').trim(); if (!name) return toast('Give the region a name.'); await saveCfg(c => { c.regions.push({ id: newId(), name, kind: $('#nr-kind').value }); }); return go(); }
    case 'region-del': { if (unitsIn(d.rid).length) return toast('Delete or move its branches first.'); if (!confirm('Delete this region?')) return; await saveCfg(c => { c.regions = c.regions.filter(r => r.id !== d.rid); }); return go(); }
    case 'unit-add': { const r = regionById(d.rid), rest = r.kind === 'restaurants'; await saveCfg(c => { c.units.push({ id: newId(), name: rest ? 'New restaurant' : 'New branch', regionId: r.id, type: rest ? 'restaurant' : unitsIn(r.id).some(u => u.type === 'main') ? 'outlet' : 'main', cats: rest ? ['rice', 'hotkitchen', 'juice'] : ['bakery', 'bread', 'cakes', 'short', 'tea'] }); }); return go(); }
    case 'unit-del': { const u = unitById(d.uid); if (!confirm(`Delete ${u.name}? Its base figures, plan and actuals are deleted too.`)) return; await saveCfg(c => { c.units = c.units.filter(x => x.id !== u.id); }); for (const k of [...Store.keys('base:' + u.id), ...Store.keys('plan:' + u.id), ...Store.keys('act:' + u.id + ':')]) await Store.del(k); return go(); }
    case 'model-add': await saveCfg(c => { c.models.push({ id: newId(), type: 'small_branch', name: 'New outlet model', sales: {}, rm: {}, wastage: 3, gaspack: 2, branchExp: 3, ss: 7, oh: 6, bm: 3 }); }); return go();
    case 'model-del': if (!confirm('Delete this model?')) return; await saveCfg(c => { c.models.splice(+d.i, 1); }); return go();
    case 'cat-add': { const name = ($('#nc-name').value || '').trim(); if (!name) return; await saveCfg(c => { c.cats.push({ id: 'c' + newId().slice(-6), name, section: '', vatExempt: false, inputVat: 40 }); }); return go(); }
    case 'cat-del': { const k = CFG().cats[+d.i]; if (CFG().units.some(u => u.cats.includes(k.id))) return toast('Remove it from every branch first (Group structure).'); await saveCfg(c => { c.cats.splice(+d.i, 1); }); return go(); }
    case 'sec-add': { const name = ($('#ns-name').value || '').trim(); if (!name) return; await saveCfg(c => { c.sections.push({ id: 's' + newId().slice(-6), name }); }); return go(); }
    case 'sec-del': { const s = CFG().sections[+d.i]; if (CFG().cats.some(c => c.section === s.id)) return toast('Move its categories to another production unit first.'); await saveCfg(c => { c.sections.splice(+d.i, 1); }); return go(); }
    case 'base-sec-add': { const s = ($('#bsec-' + d.uid) || {}).value; if (!s) return; await updRec('base:' + d.uid, b => { b.prod = b.prod || {}; b.prod[s] = { heads: 1, salary: 50000 }; }); return go(); }
    case 'base-sec-del': await updRec('base:' + d.uid, b => { delete (b.prod || {})[d.k]; }); return go();
    case 'pin-change': {
      const o = $('#pin-old').value, n1 = $('#pin-new').value, n2 = $('#pin-new2').value;
      if (await sha256(PIN_SALT + o) !== CFG().pinHash) return toast('The current PIN is wrong.');
      if (n1.length < 4 || n1 !== n2) return toast('The new PIN must be at least 4 characters and match.');
      const h = await sha256(PIN_SALT + n1); await saveCfg(c => { c.pinHash = h; }); toast('PIN changed.'); return go();
    }
    case 'backup': { const blob = new Blob([JSON.stringify({ app: 'salgado-planner', at: new Date().toISOString(), data: Store.data }, null, 1)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const el = document.createElement('a'); el.href = url; el.download = `salgado-planner-backup-${todayStr()}.json`; document.body.appendChild(el); el.click(); el.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); return; }
    case 'sample': if (!await needUnlock('Loading sample data replaces the current set-up.')) return; if (!confirm('Replace everything with the sample data?')) return; await Store.replaceAll(await sampleData(CFG().pinHash)); toast('Sample data loaded.'); ui.scope = { kind: 'group' }; return go();
    case 'clear-all': if (!await needUnlock('Clearing all data needs the director PIN.')) return; if (!confirm('Delete ALL data: structure, base figures, plans, budgets, actuals and tasks? Download a backup first.')) return; await Store.replaceAll({ config: defaultConfig(CFG().pinHash) }); ui.scope = { kind: 'group' }; toast('All data cleared.'); return go();
  }
});
async function decToTask(key) {
  const dc = Store.get(key); if (!dc) return;
  const tid = 'task:' + newId();
  await Store.set(tid, { title: dc.text, unit: dc.unit || '', where: dc.where || '', ym: dc.ym || '', owner: '', due: dc.ym ? `${dc.ym}-01` : addDays(todayStr(), 14), notes: '', status: 'pending', source: 'decision', createdAt: new Date().toISOString() });
  await updRec(key, r => { r.status = 'tasked'; r.task = tid; }); toast('Task created on Decisions & actions.'); render();
}
async function stepAction(d, delta) {
  const ym = PYM();
  if (d.kind === 'wi') { const w = ui[d.w]; w[d.k] = Math.round((num(w[d.k]) + delta) * 10) / 10; return render(); }
  if (d.kind === 'wirm') { const w = ui[d.w]; w.rmPts = w.rmPts || {}; w.rmPts[d.k] = Math.round((num(w.rmPts[d.k]) + delta) * 10) / 10; return render(); }
  if (d.kind === 'radj') { const cur = regionPlanInputs(d.rid, ym).adj[d.k]; return setRegAdj(d.rid, ym, d.k, cur + delta); }
  const u = unitById(ui.scope.id); if (!u) return;
  const pi = planInputs(u, ym);
  if (d.kind === 'adj') return setAdj(u, ym, d.k, pi.adj[d.k] + delta);
  if (d.kind === 'heads') return setHeads(u, ym, d.k, Math.max(0, num(pi.heads[d.k]) + delta));
}
async function setAdj(u, ym, k, v) {
  v = Math.round(v * 10) / 10; const before = planInputs(u, ym).adj[k], bp = basePct(u);
  await updPlan(u, ym, p => { p.adj = p.adj || {}; p.adj[k] = v; });
  await logChange(u, ym, 'adj.' + k, lineLabel(k) + ' (% of sales)', pct(bp[k] + before / 100), pct(bp[k] + v / 100)); render();
}
async function setRegAdj(rid, ym, k, v) { v = Math.round(v * 10) / 10; await updRec('planR:' + rid, r => { r.m = r.m || {}; r.m[ym] = r.m[ym] || {}; r.m[ym].adj = r.m[ym].adj || {}; r.m[ym].adj[k] = v; }, { m: {} }); render(); }
async function setHeads(u, ym, s, v) { await updPlan(u, ym, p => { p.heads = p.heads || {}; p.heads[s] = v; }); await syncStaffTasks(u, ym); render(); }

// ---------- Changes (inputs) ----------
document.addEventListener('change', async e => {
  const el = e.target, d = el.dataset, ch = d.ch; if (!ch) return;
  const val = el.value;
  switch (ch) {
    case 'ym': ui.ym = val; ui.per.var = null; ui.per.wi = null; return render();
    case 'planym': ui.planToday = val === 'today'; if (val !== 'today') { ui.ym = val; ui.per.var = null; ui.per.wi = null; } return render();
    case 'planstart': await saveCfg(c => { c.plan.start = val; }); return render();
    case 'plann': await saveCfg(c => { c.plan.n = +val; }); return render();
    case 'per': { const p = { ...perGet(d.key) }; p[d.f] = d.f === 'n' ? +val : val; ui.per[d.key] = p; if (d.key === 'var' || d.key === 'wi') { /* keep */ } return render(); }
    case 'showcats': ui.showCats = el.checked; return render();
    case 'varrep': ui.varRep = +val; return render();
    case 'varsep': ui.varSep = el.checked; return render();
    case 'actperiod': ui.actPeriod = val; if (val.startsWith('m:')) ui.ym = months().includes(val.slice(2)) ? val.slice(2) : ui.ym; return render();
    case 'basesel': ui.baseSel = val; return render();
    case 'stepval': {
      const v = num(val);
      if (d.kind === 'wi') { ui[d.w][d.k] = v; return render(); }
      if (d.kind === 'wirm') { ui[d.w].rmPts = ui[d.w].rmPts || {}; ui[d.w].rmPts[d.k] = v; return render(); }
      if (d.kind === 'radj') return setRegAdj(d.rid, PYM(), d.k, v);
      const u = unitById(ui.scope.id); if (d.kind === 'adj') return setAdj(u, PYM(), d.k, v); if (d.kind === 'heads') return setHeads(u, PYM(), d.k, Math.max(0, Math.round(v)));
      return;
    }
    case 'salary': { const u = unitById(ui.scope.id); await updPlan(u, PYM(), p => { p.salary = p.salary || {}; p.salary[d.k] = num(val); }); return render(); }
    case 'capex': {
      const u = unitById(d.uid), ym = PYM(); await updPlan(u, ym, p => { if (val === '') delete p[d.k]; else p[d.k] = num(val); });
      const p = planRec(u)[ym] || {}, cx = num(p.capex), mt = num(p.maint);
      await upsertAutoTask(`task:capex:${u.id}:${ym}`, cx || mt ? `${[cx ? 'Capex ' + money(cx) : '', mt ? 'maintenance ' + money(mt) : ''].filter(Boolean).join(' and ')} at ${u.name} in ${monthLabel(ym)}` : '', u, ym); return render();
    }
    case 'psales': case 'pmargin': {
      const u = unitById(d.uid), ym = PYM(), before = planInputs(u, ym);
      if (ch === 'psales') { const v = Math.max(0, num(val)); if (Math.round(v) === Math.round(before.salesC[d.k])) return render(); await updPlan(u, ym, p => { p.sales = p.sales || {}; p.sales[d.k] = v; }); await logChange(u, ym, 'sales.' + d.k, catById(d.k).name + ' sales', money(before.salesC[d.k]), money(v)); }
      else { const m = Math.min(100, Math.max(-100, num(val))); if (Math.abs((100 - m) - before.rmPct[d.k]) < 0.05) return render(); await updPlan(u, ym, p => { p.rmPct = p.rmPct || {}; p.rmPct[d.k] = 100 - m; }); await logChange(u, ym, 'rm.' + d.k, catById(d.k).name + ' RM margin', (100 - before.rmPct[d.k]).toFixed(1) + '%', m.toFixed(1) + '%'); }
      return render();
    }
    case 'dectick': if (el.checked) return decToTask(d.key); return;
    case 'task-field': return updRec(d.key, r => { r[d.f] = val; }).then(render);
    case 'actual': {
      const key = `${d.prefix}:${d.period}`, rec = Store.get(key);
      if (rec && rec.submitted) { toast('This month is locked.'); return render(); }
      const v = val.trim() === '' ? undefined : num(val);
      await updRec(key, r => { r.v = r.v || {}; if (d.c) { r.v[d.k] = r.v[d.k] || {}; if (v === undefined) delete r.v[d.k][d.c]; else r.v[d.k][d.c] = v; } else if (v === undefined) delete r.v[d.k]; else r.v[d.k] = v; r.at = new Date().toISOString(); }, { v: {} });
      return render();
    }
    // Set-up
    case 'cfg': {
      if (!isUnlocked()) { toast('Unlock with the PIN first.'); return render(); }
      let v = d.type === 'num' ? (val.trim() === '' ? undefined : num(val)) : d.type === 'bool' ? el.checked : val;
      if (d.type === 'month' && !/^\d{4}-\d{2}$/.test(v)) return render();
      await saveCfg(c => setPath(c, d.path, v)); return render();
    }
    case 'region-name': if (!isUnlocked()) return render(); await saveCfg(c => { c.regions.find(r => r.id === d.rid).name = val.trim() || 'Region'; }); return render();
    case 'unit-f': if (!isUnlocked()) return render(); await saveCfg(c => { const u = c.units.find(x => x.id === d.uid); if (d.f === 'opens' && !val) delete u.opens; else u[d.f] = d.f === 'name' ? (val.trim() || 'Branch') : val; }); return render();
    case 'unit-cat': if (!isUnlocked()) return render(); await saveCfg(c => { const u = c.units.find(x => x.id === d.uid); u.cats = el.checked ? [...new Set([...u.cats, d.k])] : u.cats.filter(k => k !== d.k); }); return render();
    case 'base': {
      if (!isUnlocked()) { toast('Unlock with the PIN first.'); return render(); }
      const v = val.trim() === '' ? undefined : num(val); await updRec(d.key, b => setPath(b, d.path, v)); return render();
    }
    case 'restore': {
      const f = el.files && el.files[0]; el.value = ''; if (!f) return;
      if (!await needUnlock('Restoring a backup replaces all data.')) return;
      try { const j = JSON.parse(await f.text()); if (!j.data || !j.data.config) throw new Error('not a planner backup'); if (!confirm(`Replace all data with the backup from ${fmtDate((j.at || '').slice(0, 10))}?`)) return; await Store.replaceAll(j.data); toast('Backup restored.'); render(); }
      catch (err) { toast('That file is not a planner backup.'); }
      return;
    }
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'login-form') return; e.preventDefault();
  const err = $('#lg-err'); err.textContent = 'Signing in…';
  try { await Store.login($('#lg-user').value, $('#lg-pass').value); await startRemote(); }
  catch (x) { err.textContent = x.message === 'Invalid login credentials' ? 'Wrong login name or password.' : x.message; }
});
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('[data-setupfold]')) ui.setupOpen = e.target.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.menu) { ui.menu = false; render(); } });

// ---------- Start-up ----------
const DEFAULT_PIN = '1295';
async function ensureConfig() { if (!CFG()) await Store.set('config', defaultConfig(await sha256(PIN_SALT + DEFAULT_PIN))); }
async function startRemote() {
  Store.mode = 'remote'; render();
  try { await Store.loadRemote(); } catch (e) { if (/401|JWT|Signed out|Not signed in/.test(e.message)) { Store.saveSession(null); return render(); } Store.error = 'Could not load: ' + e.message; }
  await ensureConfig(); render();
  clearInterval(startRemote.t); startRemote.t = setInterval(() => Store.poll(), 30000);
  window.addEventListener('focus', () => Store.poll());
}
Store.onChange = kind => {
  if (kind === 'remote') { const a = document.activeElement; if (a && /INPUT|SELECT|TEXTAREA/.test(a.tagName) && a.closest('#app')) { Store.dirtyRender = true; return; } render(); }
  else { const s = document.querySelector('.sync'); if (s && Store.mode === 'remote') { const dot = s.querySelector('.dot'); if (dot) { dot.className = 'dot' + (Store.error ? ' err' : Store.pending ? ' busy' : ''); dot.nextSibling.textContent = ' ' + (Store.error ? Store.error : Store.pending ? 'Saving…' : 'Saved'); } } }
};
document.addEventListener('focusout', () => setTimeout(() => { if (Store.dirtyRender && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) { Store.dirtyRender = false; render(); } }, 100));
async function boot() {
  if (Store.remoteConfigured()) { Store.mode = 'remote'; if (Store.restoreSession()) return startRemote(); return render(); }
  Store.mode = 'local'; Store.loadLocal(); await ensureConfig(); render();
}
window.addEventListener('DOMContentLoaded', boot);
</script></body></html>
